<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a73e8">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Finanças Pessoais</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 16px; }
    input { display: block; width: 100%; box-sizing: border-box; padding: 10px; margin: 8px 0; }
    button { padding: 8px 12px; margin: 0 6px 8px 0; cursor: pointer; }
    button.ativo { background: #1a73e8; color: #fff; border: 0; }
    .tabela { overflow-x: auto; }
    table { border-collapse: collapse; font-size: 13px; }
    th, td { border: 1px solid #ccc; padding: 4px 8px; white-space: nowrap; }
    th { background: #f1f3f4; }
  </style>
</head>
<body>
  <h2>Finanças Pessoais</h2>

  <div id="config" hidden>
    <p>Informe o acesso. Fica salvo somente neste aparelho.</p>
    <input id="url" placeholder="URL do script (termina em /exec)">
    <input id="token" type="password" placeholder="Token">
    <button id="salvar">Salvar</button>
  </div>

  <div id="app" hidden>
    <div id="abas"></div>
    <div id="conteudo" class="tabela"></div>
    <p><button id="recarregar">Atualizar</button><button id="sair">Trocar acesso</button></p>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const CHAVE = "fin_cfg";
    let dados = {};

    function lerCfg() {
      try { return JSON.parse(localStorage.getItem(CHAVE)); } catch (e) { return null; }
    }

    async function carregar() {
      const c = lerCfg();
      if (!c) { $("config").hidden = false; $("app").hidden = true; return; }
      $("config").hidden = true; $("app").hidden = false;
      $("conteudo").textContent = "Carregando...";
      try {
        const r = await fetch(c.url + "?token=" + encodeURIComponent(c.token));
        const d = await r.json();
        if (d.erro) throw new Error(d.erro);
        dados = d;
        montarAbas();
      } catch (e) {
        $("conteudo").textContent = "Erro: " + e.message;
      }
    }

    function montarAbas() {
      const box = $("abas");
      box.textContent = "";
      Object.keys(dados).forEach((nome, i) => {
        const b = document.createElement("button");
        b.textContent = nome;
        b.onclick = () => mostrar(nome);
        box.appendChild(b);
        if (i === 0) mostrar(nome);
      });
    }

    function mostrar(nome) {
      document.querySelectorAll("#abas button").forEach(b =>
        b.classList.toggle("ativo", b.textContent === nome));
      const alvo = $("conteudo");
      const aba = dados[nome];
      alvo.textContent = "";
      if (aba.erro) { alvo.textContent = aba.erro + ": " + nome; return; }
      const t = document.createElement("table");
      const cab = t.insertRow();
      aba.cabecalho.forEach(h => {
        const th = document.createElement("th");
        th.textContent = h;
        cab.appendChild(th);
      });
      aba.linhas.slice(0, 200).forEach(l => {
        const tr = t.insertRow();
        l.forEach(c => { tr.insertCell().textContent = c; });
      });
      alvo.appendChild(t);
    }

    $("salvar").onclick = () => {
      const url = $("url").value.trim();
      const token = $("token").value.trim();
      if (!url || !token) return;
      localStorage.setItem(CHAVE, JSON.stringify({ url, token }));
      carregar();
    };
    $("recarregar").onclick = carregar;
    $("sair").onclick = () => { localStorage.removeItem(CHAVE); carregar(); };

    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
    carregar();
  </script>
</body>
</html>
